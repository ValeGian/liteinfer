<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benchmark Comparison</title>
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f9fa;
    color: #212529;
    padding: 24px;
}
h1 { font-size: 1.6rem; margin-bottom: 20px; color: #1a1a2e; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.tab-btn {
    padding: 8px 16px;
    border: 1px solid #dee2e6;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    color: #495057;
    transition: background 0.15s;
}
.tab-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.note {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.83rem;
    color: #664d03;
}
table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
th {
    background: #1a1a2e;
    color: #fff;
    padding: 10px 14px;
    text-align: left;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
}
td {
    padding: 10px 14px;
    font-size: 0.85rem;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
.best { background: #d4edda; color: #155724; font-weight: 600; }
.worst { background: #f8d7da; color: #721c24; }
.tag { font-size: 0.75rem; color: #6c757d; margin-left: 6px; }

</style>
</head>
<body>
<h1>Benchmark Comparison</h1>
<div class="tabs"></div>

<p>No pinned results. Use <code>bench dashboard promote &lt;run_id&gt;</code> to add results.</p>
<script>

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('btn-' + tabId).classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
}
window.addEventListener('DOMContentLoaded', function() {
    var first = document.querySelector('.tab-btn');
    if (first) first.click();
});

</script>
</body>
</html>
